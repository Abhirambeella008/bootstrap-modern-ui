<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="py-5 container">
  <h2 class="fw-bold text-center mb-4">Contact Us</h2>
  <form class="glass-form mx-auto">
    <input class="form-control mb-3" placeholder="Name">
    <input class="form-control mb-3" placeholder="Email">
    <textarea class="form-control mb-3" rows="4" placeholder="Message"></textarea>
    <button class="btn btn-gradient w-100">Send Message</button>
  </form>
</section>

</body>
</html>
